<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="titulo-img">
  <title id="titulo-img">Sala de leitura com janela, planta, mesa com livro aberto, cadeira e estante</title>
